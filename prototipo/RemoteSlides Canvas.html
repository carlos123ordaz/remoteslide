<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>RemoteSlides — Prototipo</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  html, body { margin: 0; padding: 0; background: #f0eee9; font-family: 'Geist', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  * { box-sizing: border-box; }
  /* Each artboard's content uses cqw for fluid type that scales with the artboard size. */
  [data-screen-label] { container-type: inline-size; }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="ios-frame.jsx"></script>
<script type="text/babel" src="deck-data.jsx"></script>
<script type="text/babel" src="screens.jsx"></script>

<script type="text/babel">
function App() {
  return (
    <PresentationProvider>
      <DesignCanvas>
        <DCSection id="flow" title="RemoteSlides" subtitle="Flujo completo · 7 pantallas · el control del celular maneja la presentación en vivo">
          <DCArtboard id="01-landing" label="01 · Landing" width={1280} height={800}>
            <ScreenLanding />
          </DCArtboard>
          <DCArtboard id="02-upload" label="02 · Subir archivo" width={1280} height={800}>
            <ScreenUpload />
          </DCArtboard>
          <DCArtboard id="03-qr" label="03 · QR + preview" width={1280} height={800}>
            <ScreenQR />
          </DCArtboard>
          <DCArtboard id="04-pairing" label="04 · Pareo (móvil)" width={390} height={844}>
            <ScreenPairing />
          </DCArtboard>
          <DCArtboard id="05-remote" label="05 · Control remoto (móvil) · interactivo" width={390} height={844}>
            <ScreenRemote />
          </DCArtboard>
          <DCArtboard id="06-fullscreen" label="06 · Presentación a pantalla completa · refleja el control" width={1280} height={800}>
            <ScreenFullscreen />
          </DCArtboard>
          <DCArtboard id="07-end" label="07 · Resumen final" width={1280} height={800}>
            <ScreenEnd />
          </DCArtboard>
        </DCSection>
      </DesignCanvas>
    </PresentationProvider>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
